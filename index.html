<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Precificação - Confeitaria Inteligente</title>
  
  <!-- Tailwind CSS v3 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            sweet: {
              50: '#fffbf9',
              100: '#fcf2ee',
              200: '#f9e4dd',
              300: '#f1cdc1',
              400: '#e4aa99',
              500: '#ec4899', /* primary (Deep Rose) */
              600: '#db2777',
              700: '#be185d',
              800: '#5c3d37', /* text cocoa */
              900: '#372521', /* cocoa dark */
            }
          }
        }
      }
    }
  </script>
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    // Fallback de segurança caso a CDN falhe ou esteja offline
    window.lucide = window.lucide || { createIcons: () => console.warn('Lucide Icons CDN offline') };
  </script>
</head>
<body class="h-full flex flex-col bg-sweet-50 text-sweet-900 select-none antialiased">

  <!-- Header Fixo -->
  <header class="sticky top-0 z-40 w-full glass border-b border-sweet-200/50 py-3 px-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-full bg-sweet-500 flex items-center justify-center text-white shadow-sm">
        <i data-lucide="cake" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="text-lg font-bold tracking-tight text-sweet-900">Precificação</h1>
        <p class="text-[10px] text-sweet-600 font-medium">Gestão e Custos de Confeitaria</p>
      </div>
    </div>
    
    <div class="flex items-center gap-2">
      <!-- Indicador de Status Offline -->
      <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-100 dark:bg-emerald-950/30 text-emerald-800 dark:text-emerald-300">
        <span class="w-1.5 h-1.5 mr-1 rounded-full bg-emerald-500 animate-pulse"></span> Local
      </span>
      
      <!-- Alternador de Tema Escuro -->
      <button id="btn-theme-toggle" class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-sweet-200/40 text-sweet-800 transition-colors">
        <i data-lucide="moon" class="w-4 h-4"></i>
      </button>

      <!-- Botão Configurações -->
      <button id="btn-settings" class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-sweet-200/40 text-sweet-800 transition-colors">
        <i data-lucide="settings" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Container Principal Rolável -->
  <main id="main-content" class="flex-1 overflow-y-auto pb-24 px-4 pt-4 max-w-md mx-auto w-full">
    <!-- O conteúdo será injetado dinamicamente via JS correspondente à aba ativa -->
    <div id="tab-loading" class="flex flex-col items-center justify-center h-64">
      <div class="w-8 h-8 border-4 border-sweet-500 border-t-transparent rounded-full animate-spin"></div>
      <p class="mt-4 text-sm text-sweet-600">Carregando seus dados...</p>
    </div>
  </main>

  <!-- Barra de Navegação Inferior -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 glass border-t border-sweet-200/50 py-2 shadow-lg max-w-md mx-auto rounded-t-2xl">
    <div class="flex justify-around items-center px-2">
      <!-- Aba Dashboard -->
      <button data-tab="dashboard" class="nav-item flex flex-col items-center gap-0.5 py-1 px-3 rounded-xl text-sweet-600 transition-all duration-200">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold">Painel</span>
      </button>
      
      <!-- Aba Insumos -->
      <button data-tab="ingredients" class="nav-item flex flex-col items-center gap-0.5 py-1 px-3 rounded-xl text-sweet-600 transition-all duration-200">
        <i data-lucide="droplet" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold">Insumos</span>
      </button>
      
      <!-- Aba Bases -->
      <button data-tab="bases" class="nav-item flex flex-col items-center gap-0.5 py-1 px-3 rounded-xl text-sweet-600 transition-all duration-200">
        <i data-lucide="egg" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold">Bases</span>
      </button>
      
      <!-- Aba Produtos -->
      <button data-tab="products" class="nav-item flex flex-col items-center gap-0.5 py-1 px-3 rounded-xl text-sweet-600 transition-all duration-200">
        <i data-lucide="tag" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold">Produtos</span>
      </button>
    </div>
  </nav>

  <!-- ========================================== -->
  <!-- MODAL DE CONFIGURAÇÕES (GLOBAL)            -->
  <!-- ========================================== -->
  <div id="modal-settings" class="fixed inset-0 z-50 hidden flex items-end sm:items-center justify-center p-4 bg-sweet-900/60 backdrop-blur-sm transition-opacity">
    <div class="w-full max-w-sm bg-white rounded-t-3xl sm:rounded-2xl p-6 shadow-xl border border-sweet-200 page-fade-in">
      <div class="flex items-center justify-between pb-4 border-b border-sweet-100">
        <div class="flex items-center gap-2">
          <i data-lucide="sliders" class="w-5 h-5 text-sweet-500"></i>
          <h3 class="text-base font-bold">Configurações Gerais</h3>
        </div>
        <button id="close-settings" class="text-sweet-600 hover:text-sweet-900">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      
      <form id="form-settings" class="space-y-4 pt-4">
        <div>
          <label class="block text-xs font-semibold text-sweet-800 mb-1" for="settings-workHourRate">
            Valor da Hora de Trabalho (R$/h)
          </label>
          <div class="relative">
            <span class="absolute left-3 top-2.5 text-sm text-sweet-600">R$</span>
            <input type="number" id="settings-workHourRate" step="0.01" min="0" required
              class="w-full pl-9 pr-3 py-2 border border-sweet-200 rounded-xl focus:outline-none focus:border-sweet-500 text-sm font-medium">
          </div>
          <p class="text-[10px] text-sweet-600 mt-1">Usado para calcular automaticamente o valor de sua mão de obra.</p>
        </div>

        <div>
          <label class="block text-xs font-semibold text-sweet-800 mb-1" for="settings-indirectCostDefault">
            Custos Indiretos Padrão (%)
          </label>
          <div class="relative">
            <input type="number" id="settings-indirectCostDefault" step="0.1" min="0" max="100" required
              class="w-full pr-8 pl-3 py-2 border border-sweet-200 rounded-xl focus:outline-none focus:border-sweet-500 text-sm font-medium">
            <span class="absolute right-3 top-2.5 text-sm text-sweet-600">%</span>
          </div>
          <p class="text-[10px] text-sweet-600 mt-1">Gás, água, energia elétrica e desgaste de equipamentos.</p>
        </div>

        <div>
          <label class="block text-xs font-semibold text-sweet-800 mb-1" for="settings-taxDefault">
            Taxa de Cartão / Delivery Padrão (%)
          </label>
          <div class="relative">
            <input type="number" id="settings-taxDefault" step="0.01" min="0" max="100" required
              class="w-full pr-8 pl-3 py-2 border border-sweet-200 rounded-xl focus:outline-none focus:border-sweet-500 text-sm font-medium">
            <span class="absolute right-3 top-2.5 text-sm text-sweet-600">%</span>
          </div>
          <p class="text-[10px] text-sweet-600 mt-1">Taxas de maquininha, iFood ou intermediários de pagamento.</p>
        </div>

        <div class="pt-2">
          <button type="submit" class="w-full bg-sweet-500 text-white py-2.5 rounded-xl font-bold hover:bg-sweet-600 transition-colors shadow-sm flex items-center justify-center gap-2">
            <i data-lucide="check" class="w-4 h-4"></i> Salvar Configurações
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Container de Notificações Toast -->
  <div id="toast-container" class="fixed top-4 left-4 right-4 sm:left-auto sm:right-4 sm:w-80 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Ponto de Início da Aplicação -->
  <script src="js/db.js"></script>
  <script src="js/ingredients.js"></script>
  <script src="js/bases.js"></script>
  <script src="js/products.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
